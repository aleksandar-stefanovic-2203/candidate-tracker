services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-candidate_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-candidate_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-candidate_tracker_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-candidate_tracker}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-candidate_tracker}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-candidate_tracker_dev}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
