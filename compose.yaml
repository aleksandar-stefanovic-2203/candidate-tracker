services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-candidate_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-candidate_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-candidate_tracker_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  flyway:
    image: flyway/flyway:10.20.1
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-candidate_tracker}
      FLYWAY_USER: ${POSTGRES_USER:-candidate_tracker}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-candidate_tracker_dev}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./db/migration:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
